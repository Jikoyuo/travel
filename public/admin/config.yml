backend:
  name: git-gateway
  branch: main

media_folder: "public/images/tours"
public_folder: "/images/tours"

collections:
  - name: "tours"
    label: "Tour Packages"
    folder: "src/content/tours"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Tour Title", name: "title", widget: "string" }
      - { label: "Category", name: "category", widget: "select", options: ["Temple Tours", "Cultural Experiences", "Nature Adventures", "Village Tours", "Food & Culinary", "Photography Tours"] }
      - { label: "Price ($)", name: "price", widget: "number", value_type: "int" }
      - { label: "Original Price ($)", name: "originalPrice", widget: "number", value_type: "int", required: false }
      - { label: "Rating", name: "rating", widget: "number", value_type: "float", default: 4.8 }
      - { label: "Review Count", name: "reviews", widget: "number", value_type: "int", default: 100 }
      - { label: "Duration", name: "duration", widget: "string", default: "5 hours" }
      - { label: "Badge", name: "badge", widget: "select", options: ["Best Seller", "Popular", "Hot", "Sale", "New"], required: false }
      - { label: "Tour Featured Image", name: "image", widget: "image" }
      - { label: "Description / Overview", name: "body", widget: "markdown" }
